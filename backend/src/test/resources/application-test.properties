# Test profile configuration
# These tests are pure Mockito service tests — no database connection is required.
# H2 in-memory config (activate with -Dspring.profiles.active=test if integration tests are added later)

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable mail auto-configuration in tests
spring.mail.host=localhost
spring.mail.port=3025

# JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Admin Bootstrap
app.bootstrap.admin.enabled=true

