spring.application.name=assetflow
server.port=${SERVER_PORT:8081}

# Database - set DB_URL, DB_USERNAME, DB_PASSWORD in your environment or application-local.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - set JWT_SECRET in your environment or application-local.properties (min 32 chars)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Mail - set MAIL_USERNAME and MAIL_PASSWORD in your environment or application-local.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin bootstrap
app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=admin@assetflow.com
app.bootstrap.admin.password=Admin@123
app.bootstrap.admin.name=AssetFlow Admin

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
